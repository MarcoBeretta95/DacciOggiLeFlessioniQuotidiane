<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dacci oggi le flessioni quotidiane</title>
<style>
:root{--bg:#f5f7fb;--fg:#17202a;--card:#fff;--line:#e3e7ee;--mut:#687386;--soft:#eef1f5;--acc:#17202a;--accfg:#fff;--ok:#2e8b57;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--bg)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--fg:#e8edf4;--card:#19212b;--line:#2a3441;--mut:#93a0b3;--soft:#243040;--acc:#e8edf4;--accfg:#10151c;--ok:#4cc38a}}
:root[data-theme="dark"]{--bg:#10151c;--fg:#e8edf4;--card:#19212b;--line:#2a3441;--mut:#93a0b3;--soft:#243040;--acc:#e8edf4;--accfg:#10151c;--ok:#4cc38a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--fg)}
.wrap{max-width:1050px;margin:auto;padding:20px}h1{margin:0;font-size:26px}h2{margin:0 0 12px;font-size:19px}.sub,.muted{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.grid,.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ex{border:1px solid var(--line);border-radius:14px;padding:14px}.ex h3{margin:0 0 6px;font-size:16px}.big{font-size:24px;font-weight:750}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0}.fill{height:100%;background:var(--acc);border-radius:99px}.fill.done{background:var(--ok)}
button,input,select{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--acc);color:var(--accfg)}
button.sec{background:var(--soft);color:var(--fg)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button{background:var(--soft);color:var(--fg)}.tabs button.on{background:var(--acc);color:var(--accfg)}
form{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:10px;align-items:end}label{font-size:13px;color:var(--mut);display:block;margin-bottom:5px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:14px}.r{text-align:right}
.note{padding:10px 12px;border-radius:10px;background:var(--soft);font-size:13px;margin:8px 0}.mn{display:flex;align-items:center;gap:10px;margin-bottom:12px}.mn h2{margin:0;flex:1}
.goal-form{grid-template-columns:repeat(4,minmax(0,1fr))}.person-form{grid-template-columns:minmax(0,1fr) auto}
@media(max-width:760px){.grid,.stats{grid-template-columns:1fr}form{grid-template-columns:1fr 1fr}.goal-form{grid-template-columns:repeat(2,minmax(0,1fr))}.person-form{grid-template-columns:1fr auto}.wrap{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
<h1>💪 Dacci oggi le flessioni quotidiane</h1><div class="sub">Challenge di gruppo · dati condivisi in tempo reale</div>
<div id="msg" class="note" style="display:none"></div>
<div class="tabs" id="tabs">
<button class="on" data-t="dash">Dashboard</button><button data-t="log">Registra</button><button data-t="ppl">Persone &amp; obiettivi</button><button data-t="his">Storico</button></div>

<section id="dash">
<div class="card"><div class="mn"><button class="sec" onclick="shift(-1)">‹</button><h2 id="mt"></h2><button class="sec" onclick="shift(1)">›</button></div>
<div class="stats" id="gs"></div></div>
<div class="card" id="wkc"><h2>Questa settimana (lun–dom)</h2><div class="stats" id="ws"></div></div>
<div class="card"><h2>Progresso individuale</h2><div class="grid" id="pc"></div></div>
</section>

<section id="log" style="display:none">
<div class="card"><h2>Registra un allenamento</h2>
<form onsubmit="addLog(event)">
<div><label>Persona</label><select id="lp"></select></div>
<div><label>Esercizio</label><select id="le"><option value="pushups">Flessioni</option><option value="squats">Squat</option><option value="lunges">Lunges</option><option value="pullups">Pull up / Chin up</option><option value="plank">Plank</option><option value="crunches">Crunches</option><option value="legraises">Leg raises</option></select></div>
<div><label id="lr-label">Ripetizioni</label><input id="lr" type="number" min="1" step="1" required></div>
<div><label>Data</label><input id="ld" type="date" required></div>
<button>+ Aggiungi</button></form></div>
<div class="card"><h2>Ultimi inserimenti</h2><div id="ll"></div></div>
</section>

<section id="ppl" style="display:none">
<div class="card"><h2>Aggiungi persona</h2><form class="person-form" onsubmit="addPerson(event)">
<div><label>Nome</label><input id="pn" required placeholder="es. Luca"></div>
<button>+ Aggiungi</button></form></div>
<div class="card"><h2>Obiettivi giornalieri per persona</h2><form id="goals-form" class="goal-form" onsubmit="saveGoals(event)">
<div><label>Flessioni / giorno / persona</label><input id="gp" type="number" min="0" step="1"></div>
<div><label>Squat / giorno / persona</label><input id="gs" type="number" min="0" step="1"></div>
<div><label>Lunges / giorno / persona</label><input id="gl" type="number" min="0" step="1"></div>
<div><label>Pull up / Chin up / giorno / persona</label><input id="gu" type="number" min="0" step="1"></div>
<div><label>Plank (minuti) / giorno / persona</label><input id="gpl" type="number" min="0" step="0.1"></div>
<div><label>Crunches / giorno / persona</label><input id="gc" type="number" min="0" step="1"></div>
<div><label>Leg raises / giorno / persona</label><input id="glr" type="number" min="0" step="1"></div>
<button>Salva</button></form></div>
<div class="card"><h2>Obiettivo mensile calcolato</h2><div class="muted" id="goal-summary"></div><div id="goal-preview"></div></div>
<div class="card"><h2>Partecipanti</h2><div class="scroll" id="pt"></div></div>
</section>

<section id="his" style="display:none"><div class="card"><h2>Storico</h2><div class="scroll" id="ht"></div></div></section>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
  apiKey:"AIzaSyA4-zZAJEX7sPW0ZYlaHLpn-0sB_NoPUSA",
  authDomain:"dacci-oggi-le-flessioni.firebaseapp.com",
  projectId:"dacci-oggi-le-flessioni",
  storageBucket:"dacci-oggi-le-flessioni.firebasestorage.app",
  messagingSenderId:"806988757237",
  appId:"1:806988757237:web:7e18e90cb9566ecb5a2dbc"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const EX={pushups:"Flessioni",squats:"Squat",lunges:"Lunges",pullups:"Pull up / Chin up",plank:"Plank",crunches:"Crunches",legraises:"Leg raises"},K=Object.keys(EX);
const DEFAULT_DAILY_GOALS={pushups:30,squats:20,lunges:20,pullups:3,plank:1,crunches:15,legraises:10};
const $=id=>document.getElementById(id);
const ds=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const S={dailyGoals:{...DEFAULT_DAILY_GOALS},people:[],logs:[]};
const today=new Date();let vm=ds(today).slice(0,7),canWrite=true;
const n=x=>(+x||0).toLocaleString("it-IT"),pct=(a,b)=>b?Math.min(100,a/b*100):0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const quantity=(e,v)=>n(v)+(e==="plank"?" min":"");
const monthDays=()=>{const[y,m]=vm.split("-").map(Number);return new Date(y,m,0).getDate()};
const groupTarget=e=>(+S.dailyGoals[e]||0)*S.people.length*monthDays();
function note(t){const m=$("msg");m.textContent=t;m.style.display=t?"block":"none"}
function shift(k){const[y,m]=vm.split("-").map(Number),d=new Date(y,m-1+k,1);vm=ds(d).slice(0,7);render()}
const inM=()=>S.logs.filter(l=>l.date.slice(0,7)===vm);
const tot=(e,pid)=>inM().filter(l=>l.exercise===e&&(!pid||l.personId===pid)).reduce((a,l)=>a+l.reps,0);
function weekRange(){const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()),w=(d.getDay()+6)%7;const a=new Date(d);a.setDate(d.getDate()-w);const b=new Date(a);b.setDate(a.getDate()+6);return[ds(a),ds(b)]}
function wtot(e,pid){const[a,b]=weekRange();return S.logs.filter(l=>l.exercise===e&&l.date>=a&&l.date<=b&&(!pid||l.personId===pid)).reduce((x,l)=>x+l.reps,0)}
function wtarget(dailyGoal){return Math.ceil(dailyGoal*7)}
function row(e,v,g,extra){const p=pct(v,g);return `<div class="muted">${EX[e]}</div><div><b>${quantity(e,v)}</b> / ${quantity(e,g)}</div><div class="bar"><div class="fill ${p>=100?"done":""}" style="width:${p}%"></div></div>${extra||""}`}
function render(){
 const[y,m]=vm.split("-").map(Number);
 $("mt").textContent="Obiettivi di "+new Date(y,m-1,1).toLocaleDateString("it-IT",{month:"long",year:"numeric"});
 $("gs").innerHTML=K.map(e=>{const t=tot(e),g=groupTarget(e);return `<div class="ex"><h3>${EX[e]}</h3><div class="big">${quantity(e,t)} / ${quantity(e,g)}</div><div class="bar"><div class="fill ${t>=g&&g>0?"done":""}" style="width:${pct(t,g)}%"></div></div><div class="muted">${pct(t,g).toFixed(0)}% · ${g>0&&t>=g?"obiettivo raggiunto 🎉":quantity(e,g-t)+" mancanti"}</div></div>`}).join("");
 const cur=vm===ds(today).slice(0,7);$("wkc").style.display=cur?"block":"none";
 if(cur)$("ws").innerHTML=K.map(e=>{const t=wtot(e),g=wtarget((+S.dailyGoals[e]||0)*S.people.length);return `<div class="ex"><h3>${EX[e]}</h3><div class="big">${quantity(e,t)} / ${quantity(e,g)}</div><div class="bar"><div class="fill ${t>=g&&g>0?"done":""}" style="width:${pct(t,g)}%"></div></div><div class="muted">target settimanale di gruppo</div></div>`}).join("");
 $("pc").innerHTML=S.people.map(p=>`<div class="ex"><h3>${esc(p.name)}</h3>${K.map(e=>{const daily=+S.dailyGoals[e]||0;return row(e,tot(e,p.id),daily*monthDays(),cur&&daily?`<div class="muted">settimana: ${quantity(e,wtot(e,p.id))} / ${quantity(e,wtarget(daily))}</div>`:"")}).join("")}</div>`).join("")||'<div class="muted">Aggiungi i partecipanti nella scheda "Persone &amp; obiettivi".</div>';
 const sel=$("lp").value;$("lp").innerHTML=S.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");if(sel)$("lp").value=sel;
 const nm=id=>esc(S.people.find(p=>p.id===id)?.name||"Rimosso");
 const rm=l=>canWrite?`<button class="sec" onclick="delLog('${l.id}')">✕</button>`:"";
 $("ll").innerHTML=S.logs.slice(0,20).map(l=>`<div class="note"><b>${nm(l.personId)}</b> · ${EX[l.exercise]} · <b>${quantity(l.exercise,l.reps)}</b> · ${new Date(l.date+"T12:00:00").toLocaleDateString("it-IT")} ${rm(l)}</div>`).join("")||'<div class="muted">Nessun inserimento.</div>';
 $("pt").innerHTML=`<table><tr><th>Persona</th><th></th></tr>${S.people.map(p=>`<tr><td>${esc(p.name)}</td><td class="r">${canWrite?`<button class="sec" onclick="delPerson('${p.id}')">Rimuovi</button>`:""}</td></tr>`).join("")}</table>`;
 if(!$("goals-form").contains(document.activeElement)){const ids={pushups:"gp",squats:"gs",lunges:"gl",pullups:"gu",plank:"gpl",crunches:"gc",legraises:"glr"};K.forEach(e=>$(ids[e]).value=S.dailyGoals[e])}
 $("goal-summary").textContent=`${S.people.length} ${S.people.length===1?"persona":"persone"} × ${monthDays()} giorni (${new Date(y,m-1,1).toLocaleDateString("it-IT",{month:"long"})})`;
 $("goal-preview").innerHTML=K.map(e=>`<div>${EX[e]}: ${quantity(e,groupTarget(e))}</div>`).join("");
 $("ht").innerHTML=`<table><tr><th>Data</th><th>Persona</th><th>Esercizio</th><th class="r">Quantità</th></tr>${S.logs.map(l=>`<tr><td>${new Date(l.date+"T12:00:00").toLocaleDateString("it-IT")}</td><td>${nm(l.personId)}</td><td>${EX[l.exercise]}</td><td class="r">${quantity(l.exercise,l.reps)}</td></tr>`).join("")||"<tr><td colspan='4'>Nessun dato</td></tr>"}</table>`;
}
async function w(fn){if(!db){note("Database non disponibile.");return}
 try{await fn()}catch(e){console.error(e);note("Errore database: "+(e.message||e.code||e));}}
function addLog(ev){ev.preventDefault();if(!$("lp").value){note("Aggiungi prima almeno una persona.");return}
 w(async()=>{await db.collection("logs").add({personId:$("lp").value,exercise:$("le").value,reps:+$("lr").value,date:$("ld").value,ts:Date.now()});$("lr").value=""})}
function delLog(id){w(()=>db.doc("logs/"+id).delete())}
function addPerson(ev){ev.preventDefault();w(async()=>{await db.collection("people").add({name:$("pn").value.trim(),ts:Date.now()});$("pn").value=""})}
function delPerson(id){if(confirm("Rimuovere questa persona? Gli inserimenti restano nello storico."))w(()=>db.doc("people/"+id).delete())}
function saveGoals(ev){ev.preventDefault();const ids={pushups:"gp",squats:"gs",lunges:"gl",pullups:"gu",plank:"gpl",crunches:"gc",legraises:"glr"};const dailyGoals=Object.fromEntries(K.map(e=>[e,+$(ids[e]).value||0]));w(()=>db.doc("config/dailyGoals").set({dailyGoals}))}
function syncExerciseInput(){const plank=$("le").value==="plank";$("lr-label").textContent=plank?"Minuti":"Ripetizioni";$("lr").min=plank?"0.1":"1";$("lr").step=plank?"0.1":"1"}
$("tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;["dash","log","ppl","his"].forEach(s=>$(s).style.display=s===t?"block":"none");[...$("tabs").children].forEach(b=>b.classList.toggle("on",b===e.target))};
$("ld").value=ds(today);$("le").onchange=syncExerciseInput;syncExerciseInput();render();
const err=e=>{console.error(e);note("Errore dati: "+(e.message||e.code||e));};
db.doc("config/dailyGoals").onSnapshot(s=>{if(s.exists)S.dailyGoals={...DEFAULT_DAILY_GOALS,...(s.data().dailyGoals||{})};render()},err);
db.collection("people").orderBy("ts","asc").onSnapshot(q=>{S.people=q.docs.map(d=>({id:d.id,name:d.data().name||"?"}));render()},err);
db.collection("logs").orderBy("ts","desc").limit(1000).onSnapshot(q=>{S.logs=q.docs.map(d=>({id:d.id,...d.data()}));render()},err);
</script>
</body>
</html>
